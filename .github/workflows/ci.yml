name: MCF Parallel Chat CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Start local test server
        run: |
          node server.mjs > /tmp/mcf-parallel-chat-ci.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:48721/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mcf-parallel-chat-ci.log
          exit 1
      - name: Run tests (no external Gemini credentials)
        run: npm test
